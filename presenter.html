<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aries 발표자 화면</title>
<style>
  @font-face{font-family:Pretendard;font-weight:400;src:url(fonts/Pretendard-Regular.otf)}
  @font-face{font-family:Pretendard;font-weight:600;src:url(fonts/Pretendard-SemiBold.otf)}
  @font-face{font-family:Pretendard;font-weight:700 900;src:url(fonts/Pretendard-Bold.otf)}
  :root{--bg:#111316;--panel:#1B1E23;--line:#2C3037;--t1:#F1F3F5;--t2:#A9B0BA;--green:#8BD450;--deep:#2B8636;--amber:#F5B565;--red:#F08A6B}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--t1);font-family:Pretendard,system-ui,sans-serif;display:grid;grid-template-columns:var(--lw,1.25fr) 12px 1fr;grid-template-rows:auto 1fr auto;gap:16px 4px;padding:16px;word-break:keep-all}
  header{grid-column:1/-1;display:flex;align-items:center;gap:16px}
  header h1{font-size:18px;font-weight:700;color:var(--t2)}
  .btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--t1);font:600 16px Pretendard,sans-serif;cursor:pointer}
  .btn:hover{border-color:#4A505A}
  .btn.go{background:var(--deep);border-color:var(--deep)}
  .status{margin-left:auto;font-size:14px;color:var(--t2)}
  .status b{color:var(--green)} .status b.off{color:var(--amber)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;min-height:0}
  .label{font-size:13px;font-weight:700;color:var(--t2);margin-bottom:8px;display:flex;justify-content:space-between}
  /* 발표 화면(TV 16:9)과 같은 비율 — 칸이 좁아도 찌그러지지 않게 flex:none */
  .frame{position:relative;flex:none;width:100%;aspect-ratio:var(--ar,16/9);border-radius:10px;overflow:hidden;background:#fff}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
  /* 지금 화면 + 다음 화면(지금의 55%)이 세로로 다 들어가는 가장 큰 16:9 크기 */
  #left{gap:6px;overflow:auto;--w:min(100%, calc((100vh - 250px) / 1.55 * 1.7778))}
  #left > .frame{width:var(--cw,var(--w));max-width:100%}
  #nextwrap .frame{width:var(--nw,calc(var(--w) * .55));max-width:100%}
  /* 끌어서 크기 조절: 가운데 세로줄(화면↔대본), 각 미리보기 아래 손잡이 */
  .gut{position:relative;border-radius:8px;transition:background .15s}
  .gut::after{content:"";position:absolute;border-radius:4px;background:#3A3F47;transition:background .15s}
  .gut:hover,.gut.drag{background:rgba(139,212,80,.12)} .gut:hover::after,.gut.drag::after{background:var(--green)}
  #gutX{cursor:col-resize;margin:40px 0} #gutX::after{left:4px;width:4px;top:50%;height:60px;margin-top:-30px}
  .gutY{flex:none;height:14px;cursor:ns-resize;max-width:100%} .gutY::after{top:5px;height:4px;left:50%;width:60px;margin-left:-30px}
  #cgut{width:var(--cw,var(--w))} #ngut{width:var(--nw,calc(var(--w) * .55))}
  .gutY:hover::before,#gutX:hover::before{position:absolute;color:var(--green);font-size:14px;font-weight:800;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap}
  .gutY:hover::before{content:"↕"} #gutX:hover::before{content:"↔"}
  body.resizing,body.resizing *{user-select:none}
  body.resizing iframe{pointer-events:none}
  #script{font-size:26px;line-height:1.65;overflow:auto;padding-right:6px;flex:1}
  #script em{font-style:normal;color:var(--green);font-weight:700}
  #script .qa{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:#22262C} #script .qa b{display:block;font-size:20px;color:var(--green);margin-bottom:4px} #script .qa p{font-size:19px;line-height:1.55;color:var(--t1)}
  #script .cue{display:block;font-size:16px;color:var(--amber);margin-bottom:10px;font-weight:700}
  footer{grid-column:1/-1;display:flex;align-items:center;gap:14px}
  .clock{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .clock.warn{color:var(--amber)} .clock.over{color:var(--red)}
  .sub{font-size:15px;color:var(--t2)}
  .bar{flex:1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--deep),var(--green));transition:width .4s}
  .num{font-size:22px;font-weight:800;min-width:90px;text-align:right}
  .help{font-size:13px;color:var(--t2)}
  #stime{font-variant-numeric:tabular-nums}
  #stime.soon{color:var(--amber)} #stime.over{color:var(--red)}
  /* 장별 권장 시간 알림 (발표자 화면에만) */
  #toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);padding:16px 26px;border-radius:16px;background:var(--amber);color:#1B1E23;font:800 22px Pretendard,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:9}
  #toast.show{transform:translate(-50%,0)} #toast.over{background:var(--red);color:#fff}
  #script.over{box-shadow:inset 4px 0 0 var(--red);padding-left:12px}
</style>
</head>
<body>
<header>
  <h1>Aries 발표자 화면</h1>
  <button class="btn go" id="open">① 발표 화면 열기</button>
  <button class="btn" id="fs">② 발표 화면 전체 화면</button>
  <span class="help">발표 화면 창을 TV로 끌어 놓은 뒤 ②를 누르세요(안 되면 그 창을 한 번 클릭하고 F).</span>
  <span class="help">발표 화면 비율: <b id="ratio">16:9</b></span>
  <span class="status" id="status">발표 화면: <b class="off">연결 안 됨</b></span>
</header>

<div class="panel" id="left">
  <div class="label"><span>지금 화면</span><span id="title"></span></div>
  <div class="frame"><iframe id="cur" title="지금 화면"></iframe></div>
  <div class="gut gutY" id="cgut" title="끌어서 지금 화면 크기 조절 (두 번 누르면 원래대로)"></div>
  <div id="nextwrap">
    <div class="label"><span>다음 화면</span><span id="ntitle"></span></div>
    <div class="frame"><iframe id="next" title="다음 화면"></iframe></div>
    <div class="gut gutY" id="ngut" title="끌어서 다음 화면 크기 조절 (두 번 누르면 원래대로)"></div>
  </div>
</div>
<div class="gut" id="gutX" title="끌어서 화면과 대본 너비 조절 (두 번 누르면 원래대로)"></div>

<div class="panel">
  <div class="label"><span>대본</span><span><span id="stime"></span> <span id="guide"></span></span></div>
  <div id="script"></div>
</div>

<div id="toast"></div>
<footer>
  <button class="btn" id="prev">← 이전</button>
  <button class="btn go" id="nextBtn">다음 →</button>
  <div class="clock" id="clock">5:00</div>
  <div class="sub">남은 시간<br><span id="elapsed">0:00 지남</span></div>
  <button class="btn" id="timer">시간 시작</button>
  <button class="btn" id="reset">시간 초기화</button>
  <div class="bar"><i id="prog"></i></div>
  <div class="num" id="num">0 / 0</div>
</footer>

<script>
(() => {
  // 장 순서는 index.html과 같음(빈 화면 = 0). 대본은 말할 내용의 길잡이 — 그대로 읽지 않아도 됨.
  const S = [
    { t: '시작 전 빈 화면', g: '', s: '<span class="cue">시작 전</span>발표 화면을 TV에 띄우고 전체 화면으로 맞춰 둡니다. 소개를 받으면 <em>다음 →</em>' },
    { t: '표지', g: '0:15', s: '안녕하세요, 영남공업고등학교 김현성입니다.<br>하루 5분, 게임처럼 <em>AI를 바르게 쓰는 법</em>을 배우는 앱 <em>Aries</em>를 소개하겠습니다.' },
    { t: '문제 — 이야기', g: '0:30', s: '주변 친구들, 부모님, 그리고 많은 사람들이 AI를 그저 유행으로, 말 잘하는 챗봇으로만 생각하고, AI가 하는 말을 <em>그대로 믿습니다.</em><br>“AI가 그렇다던데?”, “숙제 그냥 AI한테 시켰어”, “이름이랑 학교 넣어서 물어봤는데?”<br>쓰는 법은 다 아는데, <em>바르게 쓰는 법은 배운 적이 없습니다.</em>' },
    { t: '문제 — 숫자', g: '0:30', s: '숫자로 보면 더 분명합니다.<br>중·고등학생의 <em>67.9%</em>가 이미 생성형 AI를 써 봤고, 청소년의 <em>55%</em>는 AI가 준 정보를 믿는다고 답했습니다.<br>그 사이 AI로 목소리까지 흉내 내는 보이스피싱 피해는 작년 <em>1조 2,578억 원</em>, 1년 만에 47% 늘었습니다.' },
    { t: '해결', g: '0:20', s: '그래서 Aries를 만들었습니다.<br><em>하루 5분, 게임처럼, 중학생 눈높이로</em> — 듀오링고처럼 짧은 레슨을 풀면서 AI를 바르게 쓰는 습관을 들입니다.' },
    { t: '문제 유형', g: '0:20', s: '문제는 여덟 가지입니다. 객관식, 위험·안전 판정, 짝 잇기, 빈칸, AI 답에서 틀린 문장 찾기, 블록으로 좋은 질문 만들기,<br>그리고 메신저처럼 생긴 <em>채팅 시뮬레이션</em>에서 사기 메시지에 어떻게 대처할지 고릅니다. 진짜 AI와 연습하는 Live AI도 곧 붙습니다. 지금 섹션 1 문제가 <em>160개</em>입니다.' },
    { t: '고객과 가치', g: '0:25', s: '쓰는 사람은 <em>중·고등학생</em>입니다. AI를 쓰지만 확인하는 법을 모르는 학생에게 5분짜리 습관을 줍니다.<br>구독은 <em>만 14세 이상이면 학생 본인이</em>, <em>만 14세 미만이면 부모님이</em> 합니다. 학생은 자기 성장 리포트를, 부모님은 주간 학습 요약을 받습니다.<br>다음 고객은 <em>학교와 기관</em>입니다. 수업에 바로 쓰는 클래스용 Aries로 넓혀 갑니다.' },
    { t: '시연 영상', g: '1:00', s: '<span class="cue">영상 재생 중 — 장면에 맞춰 짧게</span>학습 지도에서 레슨을 시작합니다. → 문제를 풀면 바로 맞았는지 알려 줍니다. → 채팅 시뮬레이션에서 엄마를 사칭한 문자를 받고, 원래 번호로 전화해 확인합니다. → 레슨이 끝나면 경험치와 연속 학습, 오늘의 퀘스트가 채워집니다.' },
    { t: '시장', g: '0:30', s: '전국 중·고등학생은 <em>267만 명</em>이고, 그중 생성형 AI를 써 본 학생만 약 <em>181만 명</em>입니다.<br>국내 에듀테크 시장은 올해 약 <em>10조 원</em>으로 전망되고, AI 교과서와 AI 교육으로 계속 커지고 있습니다. 첫 목표는 대구 중·고등학생입니다.' },
    { t: '수익 모델', g: '0:30', s: '핵심 안전 교육은 <em>무료</em>입니다. 신뢰가 먼저이기 때문입니다.<br>더 깊이 연습하고 싶은 학생과 부모님께는 <em>Aries Plus 월 구독</em>으로 Live AI, AI 튜터 아리, 상세 리포트와 부모님 주간 요약을 드립니다.<br>그다음은 학교·기관 라이선스입니다.<span class="cue" style="margin-top:12px">가격을 물으면: 베타에서 학생·부모님 반응을 보고 정한다고 답하기</span>' },
    { t: '기술·AI 활용', g: '0:40', s: '앱 안에서 학생 글은 AI에 가기 전에 <em>개인정보 필터와 유해 내용 검사</em>를 거칩니다. 정답이 정해진 문제는 AI 없이 서버가 채점하고, 점수와 보상은 서버가 판정해서 조작할 수 없습니다.<br>그리고 저는 이 앱을 <em>AI를 바르게 쓰는 방법 그대로</em> 만들었습니다. 저는 기획과 결정, Claude는 설계와 검토, GPT는 구현, 다른 회사 모델인 Gemini가 교차 리뷰를 하고, 자동 테스트 <em>1,700개</em>가 통과해야 완성으로 칩니다.' },
    { t: '제품 로드맵', g: '0:15', s: '지금은 레슨과 여덟 가지 문제, 채팅 시뮬레이션까지 만들었습니다.<br>다음은 AI가 실력을 채점하는 <em>진단 미션</em>, 별조각으로 꾸미는 <em>마을</em>입니다. 그리고 <em>12월에 친구들과 베타 테스트</em>를 시작합니다.' },
    { t: '성장 로드맵', g: '0:25', s: '시작은 <em>중·고등 학생</em>입니다. <em>2027년 상반기</em>에 Plus 월 구독으로 정식 출시하고,<br>그다음은 <em>학교와 기관</em>, 이어서 <em>학부모와 초등 고학년</em>, 그리고 <em>선생님과 회사원</em>까지 —<br>AI를 바르게 써야 하는 모든 사람에게 넓혀 가겠습니다.' },
    { t: '마무리', g: '0:10', s: 'AI는 앞으로 누구나 쓰게 됩니다. 그래서 중요한 건 얼마나 <em>잘</em> 쓰느냐보다, 속지 않고 확인하면서 <em>바르게</em> 쓰느냐라고 생각합니다.<br>Aries가 그 습관을 하루 5분씩 만들어 주는 앱이 되겠습니다. <em>감사합니다.</em>' },
    { t: 'Q&A', g: '5:00', s: '들어 주셔서 감사합니다. <em>궁금한 점 편하게 질문해 주세요.</em><span class="cue" style="margin-top:12px">발표 타이머 멈춤 · 질의응답 5분 — 말로 짧게(30초 안), 숫자 하나 + 이유 하나</span><div class="qa"><b>1. [사업] 수익은 언제부터, 얼마로 내나요?</b><p>2026년은 무료로 사용자를 모으고, 2027년 상반기에 Plus 월 구독을 시작합니다. 가격은 12월 베타에서 학생·부모님 반응을 보고 정합니다.</p></div><div class="qa"><b>2. [사업] 왜 무료 사용자에게도 안전 교육을 다 주나요?</b><p>안전 교육이 막히면 신뢰를 잃고 퍼지지도 않습니다. 돈은 더 깊은 연습(Live AI, AI 튜터, 리포트)에서 받습니다.</p></div><div class="qa"><b>3. [시장] 경쟁 서비스와 무엇이 다른가요?</b><p>AI 사용법 강의는 많지만, 중·고생 눈높이로 매일 5분 게임처럼 연습하는 앱은 드뭅니다. 특히 사기 메시지에 직접 답해 보는 채팅 시뮬레이션과 안전 설계가 차별점입니다.</p></div><div class="qa"><b>4. [시장] 사용자는 어떻게 모으나요?</b><p>12월 베타는 우리 학교와 친구들부터 시작하고, 그다음 대구 중·고등학교와 교육청 프로그램을 통해 넓힙니다.</p></div><div class="qa"><b>5. [시장] 부모님이 정말 돈을 낼까요?</b><p>보이스피싱·딥페이크처럼 부모님이 이미 걱정하는 문제를 다룹니다. 14세 미만은 부모님이, 14세 이상은 학생 본인이 구독하고, 부모님께는 주간 학습 요약을 드립니다.</p></div><div class="qa"><b>6. [기술] AI가 채점하면 틀릴 수도 있지 않나요?</b><p>정답이 정해진 문제는 AI 없이 서버가 채점합니다. AI는 글로 쓰는 미션에만 쓰고, 실제 사람 점수와 맞는지 따로 검증한 뒤에 씁니다.</p></div><div class="qa"><b>7. [기술] 학생 개인정보는 어떻게 지키나요?</b><p>학생 글은 AI에 보내기 전에 이름·학교·전화번호 같은 개인정보를 걸러 내고, 14세 미만은 보호자 동의를 받습니다. AI에 보낸 글은 암호화해서 30일 뒤 지웁니다.</p></div><div class="qa"><b>8. [기술] 점수나 보상을 조작할 수 있지 않나요?</b><p>점수·경험치·보상은 전부 서버가 판정하고 기록합니다. 앱을 고쳐도 바꿀 수 없습니다.</p></div><div class="qa"><b>9. [개발] 혼자 만들었나요? AI가 다 만든 거 아닌가요?</b><p>기획과 모든 결정은 제가 합니다. Claude·GPT·Gemini에게 역할을 나눠 맡기고, 다른 회사 모델이 서로 검토하게 했습니다. 자동 테스트 1,700개와 제 폰 확인을 통과해야 완성으로 칩니다.</p></div><div class="qa"><b>10. [개발] AI 모델 비용은 어떻게 감당하나요?</b><p>정답이 정해진 문제는 AI를 쓰지 않아 비용이 거의 없고, AI 채점은 하루 한도를 두었습니다. 학생 수가 늘면 구독 수익으로 감당합니다.</p></div><div class="qa"><b>11. [앞으로] 콘텐츠(문제)는 누가 만드나요? 계속 늘릴 수 있나요?</b><p>AI가 초안을 쓰고, 다른 AI가 검토하고, 제가 마지막으로 승인합니다. 지금 섹션 1이 160문제이고, 같은 방식으로 섹션 2~5를 만듭니다.</p></div><div class="qa"><b>12. [앞으로] 가장 큰 위험은 무엇인가요?</b><p>AI 기술이 빨리 바뀌어서 내용이 낡는 것입니다. 그래서 문제마다 다시 볼 날짜를 정해 두고 주기적으로 고칩니다.</p></div><div class="qa"><b>13. [기술] 회원가입·로그인은 되나요?</b><p>지금은 가입 없이 바로 시작하는 게스트 방식입니다. 학생 개인정보를 최소로 받으려고 일부러 그렇게 했고, 계정 연결과 14세 미만 보호자 동의는 12월 베타 전에 붙입니다.</p></div>' },
    { t: '끝', g: '', s: '<span class="cue">검은 화면 — 발표 끝</span>' },
  ];
  const $ = (id) => document.getElementById(id);
  let deck = null, cur = 0, linked = false;
  const total = S.length;
  const src = (n) => `index.html?preview=1#${n + 1}`;
  $('cur').src = src(0); $('next').src = src(1);

  const render = () => {
    const s = S[cur], nx = S[cur + 1];
    $('title').textContent = `${cur} · ${s.t}`;
    $('ntitle').textContent = nx ? nx.t : '끝';
    $('guide').textContent = s.g ? `권장 ${s.g}` : '';
    $('script').innerHTML = s.s;
    $('num').textContent = `${cur} / ${total - 1}`;
    $('prog').style.width = (cur / (total - 1)) * 100 + '%';
    $('cur').src = src(cur);
    $('next').src = nx ? src(cur + 1) : 'about:blank';
    $('nextwrap').style.opacity = nx ? 1 : 0.3;
  };
  // 장마다 머문 시간 — 권장 시간의 80%면 노란 알림, 넘으면 빨간 알림
  const sec = (g) => { const m = /^(\d+):(\d{2})$/.exec(g || ''); return m ? +m[1] * 60 + +m[2] : 0; };
  let slideT0 = Date.now(), warned = 0, toastT = null;
  const toast = (msg, over) => { const t = $('toast'); t.textContent = msg; t.className = 'show' + (over ? ' over' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = over ? 'over' : '', over ? 4000 : 2500); };
  const slideTick = () => {
    const lim = sec(S[cur].g), el = (Date.now() - slideT0) / 1000;
    if (!lim || cur === total - 1) { $('stime').textContent = ''; return; }
    const st = $('stime'); st.textContent = `${fmt(el)} /`;
    st.className = el > lim ? 'over' : el > lim * 0.8 ? 'soon' : '';
    $('script').classList.toggle('over', el > lim);
    if (warned < 1 && el > lim * 0.8) { warned = 1; toast(`곧 넘길 시간 — ${S[cur].t} 권장 ${S[cur].g}`); }
    if (warned < 2 && el > lim) { warned = 2; toast(`권장 시간 지남 → 다음: ${S[cur + 1]?.t ?? '끝'}`, true); }
  };
  setInterval(slideTick, 250);
  const go = (n, fromDeck) => {
    const was = cur;
    cur = Math.max(0, Math.min(total - 1, n)); render();
    if (cur !== was) { slideT0 = Date.now(); warned = 0; $('toast').className = ''; $('script').classList.remove('over'); }
    if (!fromDeck && deck && !deck.closed) deck.postMessage({ type: 'go', n: cur }, '*');
    if (cur === 1 && !running && !started) startTimer();
    // Q&A(발표 5분 끝)부터는 전체 타이머를 멈춘다
    if (cur >= total - 2 && running) { acc += (Date.now() - t0) / 1000; running = false; clearInterval(tick); $('timer').textContent = '시간 계속'; draw(); }
  };

  $('open').onclick = () => {
    deck = window.open(`index.html#${cur + 1}`, 'aries-deck', 'popup,width=1280,height=720');
    setTimeout(() => deck && deck.postMessage({ type: 'go', n: cur }, '*'), 800);
  };
  $('fs').onclick = () => { if (deck && !deck.closed) { deck.focus(); deck.postMessage({ type: 'fs' }, '*'); } };
  addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.ratio) { document.body.style.setProperty('--ar', d.ratio === '16:10' ? '16/10' : '16/9'); $('ratio').textContent = d.ratio; }
    if (d.type === 'at') { linked = true; setStatus(); if (d.n !== cur) go(d.n, true); }
  });
  const setStatus = () => {
    const ok = deck && !deck.closed && linked;
    $('status').innerHTML = `발표 화면: <b class="${ok ? '' : 'off'}">${ok ? '연결됨' : '연결 안 됨'}</b>`;
  };
  setInterval(setStatus, 1000);

  $('prev').onclick = () => go(cur - 1);
  $('nextBtn').onclick = () => go(cur + 1);
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  });

  // 발표 5분 타이머 (표지로 넘어가면 자동 시작)
  const LIMIT = 300; let running = false, started = false, t0 = 0, acc = 0, tick = null;
  const fmt = (sec) => `${sec < 0 ? '-' : ''}${Math.floor(Math.abs(sec) / 60)}:${String(Math.floor(Math.abs(sec) % 60)).padStart(2, '0')}`;
  const draw = () => {
    const el = acc + (running ? (Date.now() - t0) / 1000 : 0), left = LIMIT - el;
    $('clock').textContent = fmt(left); $('elapsed').textContent = `${fmt(el)} 지남`;
    $('clock').className = 'clock' + (left < 0 ? ' over' : left <= 60 ? ' warn' : '');
  };
  const startTimer = () => { running = true; started = true; t0 = Date.now(); $('timer').textContent = '시간 멈춤'; tick = setInterval(draw, 250); };
  $('timer').onclick = () => {
    if (running) { acc += (Date.now() - t0) / 1000; running = false; clearInterval(tick); $('timer').textContent = '시간 계속'; draw(); }
    else startTimer();
  };
  $('reset').onclick = () => { running = false; started = false; acc = 0; clearInterval(tick); $('timer').textContent = '시간 시작'; draw(); };
  // 크기 조절 — 값은 이 컴퓨터에만 기억
  const root = document.documentElement, KEY = 'aries-presenter-layout';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const save = (o) => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} };
  const lay = load();
  const apply = () => { for (const k of ['lw', 'cw', 'nw']) { if (lay[k]) document.body.style.setProperty('--' + k, lay[k] + 'px'); else document.body.style.removeProperty('--' + k); } };
  const left = $('left');
  const drag = (el, key, measure) => {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('drag'); document.body.classList.add('resizing');
      const start = { x: e.clientX, y: e.clientY, v: measure() };
      const move = (ev) => { lay[key] = Math.round(Math.max(key === 'lw' ? 360 : 160, start.v + (key === 'lw' ? ev.clientX - start.x : (ev.clientY - start.y) * 16 / 9))); apply(); save(lay); };
      const up = () => { el.classList.remove('drag'); document.body.classList.remove('resizing'); el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); save(lay); };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
    });
    el.addEventListener('dblclick', () => { delete lay[key]; apply(); save(lay); });
  };
  drag($('gutX'), 'lw', () => left.getBoundingClientRect().width);
  drag($('cgut'), 'cw', () => left.querySelector(':scope > .frame').getBoundingClientRect().width);
  drag($('ngut'), 'nw', () => $('nextwrap').querySelector('.frame').getBoundingClientRect().width);
  apply();
  render(); draw();
})();
</script>
